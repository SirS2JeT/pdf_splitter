name: Build Windows EXE

# Запускать сборку при каждом пуше в ветку main и вручную
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # Использовать виртуальную машину с последней версией Windows
    runs-on: windows-latest

    steps:
      # 1. Скачать код из репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Установить Python нужной версии
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Можно указать свою версию, например '3.10' или '3.12'
          cache: 'pip' # Включить кэширование для ускорения сборки

      # 3. Установить зависимости
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Собрать EXE с помощью PyInstaller
      - name: Build with PyInstaller
        # Важно: используем --collect-all для fitz и pymupdf
        run: >
          pyinstaller --noconfirm --onefile --windowed --name "PDF_Splitter"
          --collect-all fitz --collect-all pymupdf
          cutting.py

      # 5. Загрузить готовый EXE как артефакт
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF_Splitter-exe
          path: dist/PDF_Splitter.exe
